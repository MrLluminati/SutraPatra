name: Astro build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate article frontmatter and internal links
        run: npm run check:content
      - name: Build static website
        run: npm run build
      - name: Verify key generated pages
        run: |
          test -f dist/index.html
          test -f dist/lekh/index.html
          test -f dist/lekh/aarti-aur-stotra-mein-antar/index.html
          test -f dist/lekh/bharatiya-panchang-kya-hai/index.html
          test -f dist/lekh/sankranti-aur-tithi-mein-antar/index.html
          test -f dist/lekh/amavasya-aur-purnima/index.html
          test -f dist/lekh/aditya-hridaya-stotra-parichay/index.html
          test -f dist/lekh/hanuman-chalisa-parichay/index.html
          test -f dist/lekh/chhath-puja-char-din/index.html
          test -f dist/sitemap.xml
          test -f dist/paath/index.html
          test -f dist/paath/devta/ganesh/index.html
          test -f dist/paath/devta/hanuman/index.html
          test -f dist/paath/devta/shiv/index.html
          test -f dist/paath/devta/vishnu/index.html
          grep -q 'id="prayer-search"' dist/paath/index.html
          grep -q 'data-prayer-card' dist/paath/index.html
          test -f dist/paath/hanuman-chalisa/index.html
          test -f dist/paath/om-jai-jagdish-hare/index.html
          test -f dist/paath/jai-ganesh-deva/index.html
          test -f dist/paath/shiva-panchakshara-stotram/index.html
          test -f dist/paath/ganesha-pancharatnam/index.html
          test -f dist/paath/sukhkarta-dukhharta/index.html
          test -f dist/upkaran/index.html
          test -f dist/upkaran/jaap-mala/index.html
          test -f dist/upkaran/puja-samagri/index.html
          test -f dist/upkaran/suryoday-suryast/index.html
          test -f dist/upkaran/janam-kundli/index.html
          test -f dist/rss.xml
          test -f dist/robots.txt
