name: Astro build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build static website
        run: npm run build
      - name: Verify key generated pages
        run: |
          test -f dist/index.html
          test -f dist/lekh/index.html
          test -f dist/lekh/aarti-aur-stotra-mein-antar/index.html
          test -f dist/sitemap.xml
          test -f dist/rss.xml
          test -f dist/robots.txt
